<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Financial Advisor App</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      color: #16a34a;
    }

    input {
      padding: 10px;
      width: 200px;
    }

    button {
      padding: 10px;
      background: #16a34a;
      color: white;
      border: none;
      cursor: pointer;
    }

    ul {
      margin-top: 20px;
    }

    li {
      background: white;
      margin: 5px 0;
      padding: 10px;
      list-style: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <h1>💰 Financial Advisor</h1>

  <p>Aggiungi le tue spese:</p>

  <input id="expense" placeholder="Es: 20 euro">
  <button onclick="addExpense()">Aggiungi</button>

  <ul id="list"></ul>

  <script>
    function addExpense() {
      const value = document.getElementById("expense").value;

      if (value === "") return;

      const li = document.createElement("li");
      li.innerText = "€ " + value;

      document.getElementById("list").appendChild(li);

      document.getElementById("expense").value = "";
    }
  </script>

</body>
</html>
